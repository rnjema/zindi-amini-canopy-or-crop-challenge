[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "amini_canopy"
version = "0.0.1"
description = "A Zindi-practicing challenge with a task to develop a machine learning model to classify land cover pixels as either forest tree cover, cocoa crops, or palm plantations, using multi-year data derived from Sentinel-2 imagery."
authors = [
  { name = "Ramsey Ith Njema" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.8"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["amini_canopy"]
force_sort_within_sections = true
